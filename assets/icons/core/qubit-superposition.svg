<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Bloch Shell -->
  <circle cx="24" cy="24" r="18" stroke="#6929C4" stroke-width="1.75" />
  <!-- Equator Guide (Solid to indicate superposition plane) -->
  <ellipse cx="24" cy="24" rx="18" ry="6" stroke="#8A3FFC" stroke-width="1.5" />
  <!-- Vertical Z-Axis -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#491D8B" stroke-width="1.2" stroke-dasharray="2 2" />
  <!-- Horizontal Superposition Vector pointing to |+⟩ -->
  <line x1="24" y1="24" x2="41" y2="24" stroke="#8A3FFC" stroke-width="2.5" stroke-linecap="round" />
  <!-- |+⟩ State Indicator Node -->
  <circle cx="41" cy="24" r="4.5" fill="#8A3FFC" stroke="#181126" stroke-width="1.5" />
  <!-- Origin Anchor -->
  <circle cx="24" cy="24" r="2" fill="#6929C4" />
  <!-- Dual Amplitude Markers -->
  <circle cx="24" cy="8" r="2.5" fill="#A56EFF" opacity="0.6" />
  <circle cx="24" cy="40" r="2.5" fill="#A56EFF" opacity="0.6" />
  <!-- Label |+⟩ -->
  <text x="24" y="4" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#181126" text-anchor="middle">|+⟩</text>
</svg>
