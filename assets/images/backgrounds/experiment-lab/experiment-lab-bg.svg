<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="exp-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0F30"/>
      <stop offset="100%" stop-color="#261242"/>
    </linearGradient>
    <pattern id="exp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#491D8B" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#exp-bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#exp-grid)"/>

  <!-- Subtle Probability Interference Curves -->
  <path d="M 0 540 Q 960 180 1920 540" fill="none" stroke="#491D8B" stroke-width="1" opacity="0.25"/>
  <path d="M 0 540 Q 960 900 1920 540" fill="none" stroke="#6929C4" stroke-width="0.75" opacity="0.2"/>
</svg>