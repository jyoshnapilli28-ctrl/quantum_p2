<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="gv-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0F30"/>
      <stop offset="100%" stop-color="#281347"/>
    </linearGradient>
    <pattern id="gv-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#491D8B" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#gv-bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#gv-grid)"/>
  
  <!-- Subtle Bloch sphere coordinate guides in background (clean, restrained) -->
  <circle cx="960" cy="540" r="420" fill="none" stroke="#491D8B" stroke-width="0.75" opacity="0.3"/>
  <circle cx="960" cy="540" r="280" fill="none" stroke="#6929C4" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#6929C4" stroke-width="0.75" opacity="0.2"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#6929C4" stroke-width="0.75" opacity="0.2"/>
</svg>