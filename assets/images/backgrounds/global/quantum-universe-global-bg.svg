<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- QYNX Global Gradients -->
    <linearGradient id="qynx-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0F30" />
      <stop offset="60%" stop-color="#24143D" />
      <stop offset="100%" stop-color="#31135E" />
    </linearGradient>

    <radialGradient id="qynx-radial-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#491D8B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1C0F30" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="qynx-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#491D8B" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="48" cy="48" r="1" fill="#6929C4" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Deep Canvas -->
  <rect width="100%" height="100%" fill="url(#qynx-bg-grad)" />
  <rect width="100%" height="100%" fill="url(#qynx-radial-glow)" />
  <rect width="100%" height="100%" fill="url(#qynx-grid)" />

  <!-- Restrained Harmonic Wave Guides (Clean & Subtle) -->
  <path d="M 0 650 Q 480 500 960 590 T 1920 650" fill="none" stroke="#6929C4" stroke-width="1.2" opacity="0.2"/>
  <path d="M 0 750 Q 560 860 1200 720 T 1920 750" fill="none" stroke="#8A3FFC" stroke-width="0.8" opacity="0.12"/>
</svg>