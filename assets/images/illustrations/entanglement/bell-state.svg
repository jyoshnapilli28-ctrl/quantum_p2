  </g>

  <!-- Footer / Perfect Correlation Note -->
  <rect x="30" y="174" width="340" height="26" rx="6" fill="#31135E" stroke="#6929C4" stroke-width="1"/>
  <text x="200" y="191" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#D4BBFF" text-anchor="middle">Perfect Correlation: P(|01⟩) = 0%  •  P(|10⟩) = 0%</text>
