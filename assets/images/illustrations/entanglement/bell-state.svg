  <!-- State |00⟩ Card -->
  <g transform="translate(30, 52)">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="80" y="52" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">|00⟩</text>
