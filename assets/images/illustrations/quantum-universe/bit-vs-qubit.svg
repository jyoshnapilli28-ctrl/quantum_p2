<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none">
  <!-- Background Canvas Card -->
  <rect width="600" height="320" rx="16" fill="#1C0F30"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="#491D8B" stroke-width="1.5"/>

  <!-- LEFT: Classical Bit Card -->
  <g transform="translate(30, 30)">
    <rect width="230" height="260" rx="12" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="115" y="38" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1.5">CLASSICAL BIT</text>
    
    <!-- Discrete Binary Box: 0 OR 1 -->
    <rect x="40" y="65" width="65" height="75" rx="8" fill="#1C0F30" stroke="#6929C4" stroke-width="2"/>
    <text x="72.5" y="117" font-family="'JetBrains Mono', monospace" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
    
    <text x="115" y="110" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#D4BBFF" text-anchor="middle">OR</text>
    
    <rect x="125" y="65" width="65" height="75" rx="8" fill="#1C0F30" stroke="#6929C4" stroke-width="2"/>
    <text x="157.5" y="117" font-family="'JetBrains Mono', monospace" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

    <!-- State readout -->
    <rect x="30" y="170" width="170" height="32" rx="6" fill="#1C0F30" stroke="#491D8B" stroke-width="1"/>
    <text x="115" y="191" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FFFFFF" text-anchor="middle">State ∈ {0, 1}</text>
    
    <text x="115" y="235" font-family="'Inter', sans-serif" font-size="12" fill="#D4BBFF" text-anchor="middle">Discrete &amp; Deterministic</text>
  </g>

  <!-- CENTER: VS Divider -->
  <circle cx="300" cy="160" r="18" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
  <text x="300" y="165" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#BE95FF" text-anchor="middle">VS</text>

  <!-- RIGHT: Quantum Qubit Card -->
  <g transform="translate(340, 30)">
    <rect width="230" height="260" rx="12" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="115" y="38" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1.5">QUANTUM QUBIT</text>

    <!-- Bloch Sphere Circle -->
    <g transform="translate(115, 105)">
      <!-- Sphere disc -->
      <circle cx="0" cy="0" r="42" fill="#1C0F30" stroke="#6929C4" stroke-width="2"/>
      <!-- Equator -->
      <ellipse cx="0" cy="0" rx="42" ry="14" fill="none" stroke="#491D8B" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Z axis -->
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#491D8B" stroke-width="1.5"/>
      <!-- Basis label |0⟩ and |1⟩ -->
      <text x="0" y="-48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
      <text x="0" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">|1⟩</text>
      <!-- State Vector: pointing into superposition -->
      <line x1="0" y1="0" x2="28" y2="-24" stroke="#8A3FFC" stroke-width="3" stroke-linecap="round"/>
      <polygon points="30,-26 21,-25 24,-17" fill="#BE95FF"/>
      <circle cx="0" cy="0" r="2.5" fill="#BE95FF"/>
      <circle cx="30" cy="-26" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- State readout -->
    <rect x="25" y="170" width="180" height="32" rx="6" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <text x="115" y="191" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">|ψ⟩ = α|0⟩ + β|1⟩</text>

    <text x="115" y="235" font-family="'Inter', sans-serif" font-size="12" fill="#D4BBFF" text-anchor="middle">Continuous Superposition</text>
  </g>
</svg>