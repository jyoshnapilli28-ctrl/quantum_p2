<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none">
  <!-- Canvas Card -->
  <rect width="600" height="320" rx="16" fill="#1C0F30"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="#491D8B" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="300" y="40" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="2">QUANTUM LOGIC GATES</text>

  <!-- Quantum Wire Timeline -->
  <line x1="40" y1="125" x2="560" y2="125" stroke="#491D8B" stroke-width="3"/>

  <!-- Initial State Ket |0⟩ -->
  <circle cx="50" cy="125" r="22" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
  <text x="50" y="132" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
  <text x="50" y="165" font-family="'Inter', sans-serif" font-size="10" fill="#D4BBFF" text-anchor="middle">Input State</text>

  <!-- Gate X -->
  <g transform="translate(115, 85)">
    <rect width="80" height="80" rx="10" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">X</text>
    <text x="40" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#BE95FF" text-anchor="middle">Bit-Flip</text>
  </g>

  <!-- Gate Y -->
  <g transform="translate(225, 85)">
    <rect width="80" height="80" rx="10" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Y</text>
    <text x="40" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#BE95FF" text-anchor="middle">Bit+Phase</text>
  </g>

  <!-- Gate Z -->
  <g transform="translate(335, 85)">
    <rect width="80" height="80" rx="10" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Z</text>
    <text x="40" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#BE95FF" text-anchor="middle">Phase-Flip</text>
  </g>

  <!-- Gate H -->
  <g transform="translate(445, 85)">
    <rect width="80" height="80" rx="10" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="40" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#BE95FF" text-anchor="middle">Hadamard</text>
  </g>

  <!-- Output State Ket |ψ'⟩ -->
  <circle cx="550" cy="125" r="22" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
  <text x="550" y="132" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">|ψ'⟩</text>
  <text x="550" y="165" font-family="'Inter', sans-serif" font-size="10" fill="#D4BBFF" text-anchor="middle">Output State</text>

  <!-- Mathematical Principle Explanation Card -->
  <g transform="translate(40, 210)">
    <rect width="520" height="80" rx="10" fill="#31135E" stroke="#491D8B" stroke-width="1.5"/>
    <text x="260" y="32" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reversible Unitary Operators: U†U = I</text>
    <text x="260" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#D4BBFF" text-anchor="middle">Quantum gates rotate the state vector without extracting information or collapsing the superposition.</text>
    <text x="260" y="68" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#BE95FF" text-anchor="middle">|ψ'⟩ = U|ψ⟩  (Preserves Total Probability: ||ψ'|| = 1)</text>
  </g>
</svg>