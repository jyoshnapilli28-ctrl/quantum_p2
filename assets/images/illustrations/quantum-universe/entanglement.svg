<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none">
  <!-- Canvas Card -->
  <rect width="600" height="320" rx="16" fill="#1C0F30"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="#491D8B" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="300" y="38" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="2">QUANTUM ENTANGLEMENT</text>

  <!-- LEFT: Qubit A Node -->
  <g transform="translate(40, 60)">
    <rect width="180" height="175" rx="12" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="90" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">QUBIT A</text>

    <!-- Synchronized Phase Rings -->
    <circle cx="90" cy="95" r="42" fill="none" stroke="#6929C4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="90" cy="95" r="32" fill="#1C0F30" stroke="#8A3FFC" stroke-width="2"/>
    <line x1="90" y1="95" x2="112" y2="73" stroke="#BE95FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="112" cy="73" r="3" fill="#FFFFFF"/>
    <circle cx="90" cy="95" r="2.5" fill="#BE95FF"/>

    <text x="90" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D4BBFF" text-anchor="middle">|ψ_A⟩</text>
  </g>

  <!-- CENTER: Abstract Correlation Nexus (No physical cables) -->
  <g transform="translate(235, 75)">
    <!-- Entangled Bell State Badge -->
    <rect width="130" height="145" rx="10" fill="#1C0F30" stroke="#8A3FFC" stroke-width="2"/>
    <circle cx="65" cy="40" r="18" fill="#31135E" stroke="#6929C4" stroke-width="1.5"/>
    <path d="M 57 40 L 73 40 M 65 32 L 65 48" stroke="#BE95FF" stroke-width="2" stroke-linecap="round"/>
    
    <text x="65" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1">ENTANGLED</text>
    <text x="65" y="94" font-family="'Inter', sans-serif" font-size="9" fill="#D4BBFF" text-anchor="middle">Bell State |Φ⁺⟩</text>

    <rect x="10" y="105" width="110" height="26" rx="4" fill="#31135E" stroke="#491D8B" stroke-width="1"/>
    <text x="65" y="122" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">(|00⟩+|11⟩)/√2</text>
  </g>

  <!-- Synchronous Wave Interference Indicators (Non-cable abstract connection) -->
  <path d="M 220 120 C 230 110, 230 100, 235 100" fill="none" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 220 170 C 230 180, 230 190, 235 190" fill="none" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 380 120 C 370 110, 370 100, 365 100" fill="none" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 380 170 C 370 180, 370 190, 365 190" fill="none" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- RIGHT: Qubit B Node -->
  <g transform="translate(380, 60)">
    <rect width="180" height="175" rx="12" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="90" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">QUBIT B</text>

    <!-- Synchronized Phase Rings matching Qubit A -->
    <circle cx="90" cy="95" r="42" fill="none" stroke="#6929C4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="90" cy="95" r="32" fill="#1C0F30" stroke="#8A3FFC" stroke-width="2"/>
    <line x1="90" y1="95" x2="112" y2="73" stroke="#BE95FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="112" cy="73" r="3" fill="#FFFFFF"/>
    <circle cx="90" cy="95" r="2.5" fill="#BE95FF"/>

    <text x="90" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D4BBFF" text-anchor="middle">|ψ_B⟩</text>
  </g>

  <!-- Educational Didactic Banner -->
  <g transform="translate(40, 250)">
    <rect width="520" height="50" rx="8" fill="#31135E" stroke="#491D8B" stroke-width="1.5"/>
    <text x="260" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Non-Separable Quantum State: |ψ_AB⟩ ≠ |ψ_A⟩ ⊗ |ψ_B⟩</text>
    <text x="260" y="40" font-family="'Inter', sans-serif" font-size="10" fill="#D4BBFF" text-anchor="middle">Measuring Qubit A instantaneously collapses Qubit B with 100% correlation — without physical signal transmission.</text>
  </g>
</svg>