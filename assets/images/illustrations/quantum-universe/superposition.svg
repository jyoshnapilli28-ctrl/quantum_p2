<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none">
  <!-- Container Card -->
  <rect width="600" height="320" rx="16" fill="#1C0F30"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="#491D8B" stroke-width="1.5"/>

  <!-- LEFT: Input Basis States |0⟩ and |1⟩ -->
  <g transform="translate(40, 30)">
    <!-- |0⟩ Basis Box -->
    <rect x="0" y="0" width="130" height="110" rx="10" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <circle cx="45" cy="55" r="28" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <ellipse cx="45" cy="55" rx="28" ry="9" fill="none" stroke="#491D8B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="45" y1="55" x2="45" y2="31" stroke="#8A3FFC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="31" r="3" fill="#FFFFFF"/>
    <text x="95" y="62" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#FFFFFF">|0⟩</text>
    <text x="65" y="100" font-family="'Inter', sans-serif" font-size="10" fill="#D4BBFF" text-anchor="middle">Ground State</text>

    <!-- PLUS Operator -->
    <circle cx="65" cy="130" r="14" fill="#1C0F30" stroke="#8A3FFC" stroke-width="2"/>
    <text x="65" y="135" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#BE95FF" text-anchor="middle">+</text>

    <!-- |1⟩ Basis Box -->
    <rect x="0" y="150" width="130" height="110" rx="10" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <circle cx="45" cy="205" r="28" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <ellipse cx="45" cy="205" rx="28" ry="9" fill="none" stroke="#491D8B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="45" y1="205" x2="45" y2="229" stroke="#8A3FFC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="229" r="3" fill="#FFFFFF"/>
    <text x="95" y="212" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#FFFFFF">|1⟩</text>
    <text x="65" y="250" font-family="'Inter', sans-serif" font-size="10" fill="#D4BBFF" text-anchor="middle">Excited State</text>
  </g>

  <!-- CENTER: Convergence Flow Arrows -->
  <path d="M 190 85 C 240 85, 260 145, 300 155" fill="none" stroke="#8A3FFC" stroke-width="2.5"/>
  <path d="M 190 235 C 240 235, 260 175, 300 165" fill="none" stroke="#8A3FFC" stroke-width="2.5"/>
  <polygon points="308,160 298,154 298,166" fill="#8A3FFC"/>

  <!-- Superposition Explanation Tag -->
  <rect x="210" y="142" width="80" height="24" rx="4" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
  <text x="250" y="158" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#D4BBFF" text-anchor="middle">LINEAR SUM</text>

  <!-- RIGHT: Combined Superposition State -->
  <g transform="translate(330, 30)">
    <rect width="230" height="260" rx="12" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
    <text x="115" y="36" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1.5">SUPERPOSITION</text>

    <!-- Prominent Superposition Sphere -->
    <g transform="translate(115, 105)">
      <circle cx="0" cy="0" r="46" fill="#1C0F30" stroke="#8A3FFC" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#6929C4" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#491D8B" stroke-width="1.5"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke="#491D8B" stroke-width="1.5"/>
      <!-- Superposition Vector pointing into equator -->
      <line x1="0" y1="0" x2="34" y2="-18" stroke="#BE95FF" stroke-width="3.5" stroke-linecap="round"/>
      <polygon points="37,-20 27,-20 31,-11" fill="#FFFFFF"/>
      <circle cx="37" cy="-20" r="4" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="#8A3FFC"/>
    </g>

    <!-- Bra-Ket Formula Display -->
    <rect x="20" y="172" width="190" height="34" rx="6" fill="#1C0F30" stroke="#8A3FFC" stroke-width="1.5"/>
    <text x="115" y="194" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">|ψ⟩ = α|0⟩ + β|1⟩</text>

    <!-- Probability Invariant -->
    <text x="115" y="235" font-family="'Inter', sans-serif" font-size="11.5" fill="#D4BBFF" text-anchor="middle">|α|² + |β|² = 1</text>
  </g>
</svg>