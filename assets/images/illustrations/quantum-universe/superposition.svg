<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300"  fill="none">

    <defs>
        <!-- Glassmorphism filter -->
        <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Subtle Glow -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <!-- Strong Glow -->
        <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Linear Gradients -->
        <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#071018" />
            <stop offset="100%" stop-color="#0B132B" />
        </linearGradient>
        
        <linearGradient id="surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1C2B38" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0.9"/>
        </linearGradient>

        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#446983" />
            <stop offset="100%" stop-color="#7991A8" />
        </linearGradient>

        <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38506A" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
        </radialGradient>
        
        <!-- Grid Pattern -->
        <pattern id="quantum-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2B38" stroke-width="1"/>
            <circle cx="40" cy="40" r="1" fill="#38506A" />
        </pattern>
        
        <!-- Small Grid Pattern -->
        <pattern id="small-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0B132B" stroke-width="0.5"/>
        </pattern>
    </defs>



    <circle cx="100" cy="100" r="40" fill="url(#surface-grad)" stroke="#38506A"/>
    <text x="100" y="108" font-family="'Inter', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
    
    <text x="200" y="158" font-family="'Inter', sans-serif" font-size="24" fill="#7991A8" text-anchor="middle">+</text>

    <circle cx="100" cy="200" r="40" fill="url(#surface-grad)" stroke="#38506A"/>
    <text x="100" y="208" font-family="'Inter', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">|1⟩</text>
    
    <path d="M 160 100 Q 250 150 340 150" fill="none" stroke="#446983" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 160 200 Q 250 150 340 150" fill="none" stroke="#446983" stroke-width="2" stroke-dasharray="6 4"/>
    
    <circle cx="400" cy="150" r="50" fill="url(#surface-grad)" stroke="#446983" filter="url(#glow)"/>
    <path d="M 360 150 Q 400 120 440 150 T 520 150" fill="none" stroke="#7991A8" stroke-width="1.5" opacity="0.6"/>
    <text x="400" y="156" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">α|0⟩ + β|1⟩</text>
    
</svg>