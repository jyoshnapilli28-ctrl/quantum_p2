<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <!-- Container Card -->
  <rect width="600" height="340" rx="16" fill="#1C0F30"/>
  <rect x="1" y="1" width="598" height="338" rx="15" stroke="#491D8B" stroke-width="1.5"/>

  <!-- STEP 1: Quantum Superposition State -->
  <g transform="translate(30, 85)">
    <rect width="140" height="170" rx="12" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="70" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1">QUANTUM STATE</text>
    
    <!-- State vector circle -->
    <circle cx="70" cy="78" r="32" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <ellipse cx="70" cy="78" rx="32" ry="11" fill="none" stroke="#491D8B" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="70" y1="78" x2="92" y2="60" stroke="#8A3FFC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="92" cy="60" r="3" fill="#FFFFFF"/>
    <circle cx="70" cy="78" r="2" fill="#BE95FF"/>

    <rect x="15" y="125" width="110" height="28" rx="5" fill="#1C0F30" stroke="#6929C4" stroke-width="1"/>
    <text x="70" y="144" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">|ψ⟩ = α|0⟩ + β|1⟩</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(180, 170)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#8A3FFC" stroke-width="2.5"/>
    <polygon points="42,0 33,-5 33,5" fill="#8A3FFC"/>
  </g>

  <!-- STEP 2: Measurement Apparatus -->
  <g transform="translate(230, 85)">
    <rect width="140" height="170" rx="12" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="70" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1">MEASUREMENT</text>

    <!-- Measurement Detector Meter Glyph -->
    <rect x="25" y="50" width="90" height="65" rx="8" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <path d="M 38 95 A 35 35 0 0 1 102 95" fill="none" stroke="#491D8B" stroke-width="2"/>
    <!-- Meter Needle snapping to readout -->
    <line x1="70" y1="95" x2="88" y2="68" stroke="#8A3FFC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="95" r="3" fill="#BE95FF"/>

    <text x="70" y="140" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Projective Collapse</text>
    <text x="70" y="156" font-family="'Inter', sans-serif" font-size="9" fill="#D4BBFF" text-anchor="middle">Born Rule Sampling</text>
  </g>

  <!-- Branching Flow Arrows -->
  <g transform="translate(380, 170)">
    <!-- Branch to |0⟩ -->
    <path d="M 0 0 C 15 0, 15 -50, 30 -50" fill="none" stroke="#8A3FFC" stroke-width="2"/>
    <polygon points="36,-50 28,-54 28,-46" fill="#8A3FFC"/>
    <!-- Branch to |1⟩ -->
    <path d="M 0 0 C 15 0, 15 50, 30 50" fill="none" stroke="#8A3FFC" stroke-width="2"/>
    <polygon points="36,50 28,46 28,54" fill="#8A3FFC"/>
  </g>

  <!-- STEP 3: Collapsed Classical Outcomes |0⟩ or |1⟩ -->
  <g transform="translate(425, 55)">
    <!-- Outcome |0⟩ -->
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF">|0⟩</text>
    <text x="35" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#BE95FF">P(0) = |α|²</text>
    <circle cx="105" cy="50" r="18" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <line x1="105" y1="50" x2="105" y2="36" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round"/>
    <circle cx="105" cy="36" r="2.5" fill="#FFFFFF"/>

    <!-- Central OR label -->
    <text x="72.5" y="125" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#BE95FF" text-anchor="middle">OR</text>

    <!-- Outcome |1⟩ -->
    <rect x="0" y="135" width="145" height="100" rx="10" fill="#31135E" stroke="#491D8B" stroke-width="2"/>
    <text x="35" y="180" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF">|1⟩</text>
    <text x="35" y="205" font-family="'JetBrains Mono', monospace" font-size="11" fill="#BE95FF">P(1) = |β|²</text>
    <circle cx="105" cy="185" r="18" fill="#1C0F30" stroke="#6929C4" stroke-width="1.5"/>
    <line x1="105" y1="185" x2="105" y2="199" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round"/>
    <circle cx="105" cy="199" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>