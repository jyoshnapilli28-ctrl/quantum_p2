<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" fill="none">
  <!-- Card Background -->
  <rect x="6" y="6" width="488" height="188" rx="14" fill="#1C0F30" stroke="#491D8B" stroke-width="2"/>
  
  <!-- Header Title -->
  <text x="30" y="36" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#BE95FF" letter-spacing="1">MEASUREMENT PROBABILITY DISTRIBUTION</text>
  <text x="470" y="36" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#D4BBFF" text-anchor="end">Shots: 1024</text>

  <!-- Row 1: State |0⟩ (50%) -->
  <g transform="translate(30, 56)">
    <!-- Label -->
    <rect x="0" y="0" width="44" height="40" rx="6" fill="#31135E" stroke="#6929C4" stroke-width="1.5"/>
    <text x="22" y="25" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
    
    <!-- Track -->
    <rect x="56" y="6" width="310" height="28" rx="6" fill="#31135E" stroke="#491D8B" stroke-width="1"/>
    <!-- Fill Bar: 50% = 155px with Purple 60 -->
    <rect x="56" y="6" width="155" height="28" rx="6" fill="#8A3FFC"/>
    
    <!-- Percentage & Count -->
    <text x="380" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF">50.0%</text>
    <text x="445" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#D4BBFF">(512)</text>
  </g>

  <!-- Row 2: State |1⟩ (50%) -->
  <g transform="translate(30, 116)">
    <!-- Label -->
    <rect x="0" y="0" width="44" height="40" rx="6" fill="#31135E" stroke="#6929C4" stroke-width="1.5"/>
    <text x="22" y="25" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">|1⟩</text>
    
    <!-- Track -->
    <rect x="56" y="6" width="310" height="28" rx="6" fill="#31135E" stroke="#491D8B" stroke-width="1"/>
    <!-- Fill Bar: 50% = 155px with Purple 40 -->
    <rect x="56" y="6" width="155" height="28" rx="6" fill="#BE95FF"/>
    
    <!-- Percentage & Count -->
    <text x="380" y="25" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF">50.0%</text>
    <text x="445" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#D4BBFF">(512)</text>
  </g>

  <!-- Axis guideline / calibration -->
  <line x1="241" y1="56" x2="241" y2="160" stroke="#E8DAFF" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <text x="241" y="174" font-family="'Inter', sans-serif" font-size="9" fill="#D4BBFF" text-anchor="middle">50% Expectation</text>
</svg>