<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <marker id="exp-bf-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#BE95FF"/>
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect x="10" y="10" width="380" height="380" rx="16" fill="#1C0F30" stroke="#491D8B" stroke-width="2"/>
  
  <!-- Title Badge -->
  <text x="200" y="44" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1">BIT-FLIP EXPERIMENT</text>

  <!-- Step 1: Initial State |0⟩ -->
  <g transform="translate(150, 68)">
    <circle cx="50" cy="40" r="36" fill="#31135E" stroke="#8A3FFC" stroke-width="2.5"/>
    <text x="50" y="46" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
    <text x="50" y="94" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#D4BBFF" text-anchor="middle">Initial Ground State</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 200 172 L 200 198" stroke="#BE95FF" stroke-width="2.5" marker-end="url(#exp-bf-arrow)"/>

  <!-- Step 2: Pauli-X Operation -->
  <g transform="translate(165, 206)">
    <rect x="0" y="0" width="70" height="52" rx="10" fill="#31135E" stroke="#A56EFF" stroke-width="2.5"/>
    <text x="35" y="32" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">X</text>
    <text x="35" y="46" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#BE95FF" text-anchor="middle">PAULI-X</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 200 266 L 200 292" stroke="#BE95FF" stroke-width="2.5" marker-end="url(#exp-bf-arrow)"/>

  <!-- Step 3: Flipped State |1⟩ -->
  <g transform="translate(150, 300)">
    <circle cx="50" cy="36" r="36" fill="#31135E" stroke="#BE95FF" stroke-width="2.5"/>
    <text x="50" y="42" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">|1⟩</text>
    <text x="50" y="88" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#D4BBFF" text-anchor="middle">Inverted Excited State</text>
  </g>
</svg>