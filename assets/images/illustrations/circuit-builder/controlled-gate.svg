<svg xmlns="http://www.w3.org/2000/svg" width="250" height="180"  fill="none">

    <defs>
        <!-- Glassmorphism filter -->
        <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Subtle Glow -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <!-- Strong Glow -->
        <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Linear Gradients -->
        <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#071018" />
            <stop offset="100%" stop-color="#0B132B" />
        </linearGradient>
        
        <linearGradient id="surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1C2B38" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0.9"/>
        </linearGradient>

        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#446983" />
            <stop offset="100%" stop-color="#7991A8" />
        </linearGradient>

        <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38506A" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
        </radialGradient>
        
        <!-- Grid Pattern -->
        <pattern id="quantum-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2B38" stroke-width="1"/>
            <circle cx="40" cy="40" r="1" fill="#38506A" />
        </pattern>
        
        <!-- Small Grid Pattern -->
        <pattern id="small-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0B132B" stroke-width="0.5"/>
        </pattern>
    </defs>



    <text x="30" y="55" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF">q₀</text>
    <path d="M 60 50 L 200 50" fill="none" stroke="#38506A" stroke-width="2"/>
    
    <text x="30" y="135" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF">q₁</text>
    <path d="M 60 130 L 200 130" fill="none" stroke="#38506A" stroke-width="2"/>

    <circle cx="130" cy="50" r="6" fill="#446983"/>
    <path d="M 130 50 L 130 130" stroke="#446983" stroke-width="2"/>
    <circle cx="130" cy="130" r="16" fill="none" stroke="#446983" stroke-width="2"/>
    <path d="M 114 130 L 146 130 M 130 114 L 130 146" stroke="#446983" stroke-width="2"/>
    
</svg>