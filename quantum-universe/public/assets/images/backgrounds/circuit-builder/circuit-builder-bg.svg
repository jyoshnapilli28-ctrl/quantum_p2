<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="cb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0F30"/>
      <stop offset="100%" stop-color="#25123F"/>
    </linearGradient>
    <pattern id="cb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#491D8B" stroke-width="0.5" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#cb-bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#cb-grid)"/>

  <!-- Subtle Horizontal Track Guides for Circuit Alignment -->
  <line x1="0" y1="280" x2="1920" y2="280" stroke="#491D8B" stroke-width="0.8" opacity="0.25"/>
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#6929C4" stroke-width="0.8" opacity="0.2"/>
  <line x1="0" y1="800" x2="1920" y2="800" stroke="#491D8B" stroke-width="0.8" opacity="0.25"/>
</svg>