<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <marker id="exp-sup-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#BE95FF"/>
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect x="10" y="10" width="380" height="380" rx="16" fill="#1C0F30" stroke="#491D8B" stroke-width="2"/>
  
  <!-- Title Badge -->
  <text x="200" y="38" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1">SUPERPOSITION EXPERIMENT</text>

  <!-- Step 1: Initial State |0⟩ -->
  <g transform="translate(160, 52)">
    <rect x="0" y="0" width="80" height="44" rx="8" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
    <text x="40" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#D4BBFF" text-anchor="middle">Initial State</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 200 114 L 200 138" stroke="#BE95FF" stroke-width="2.5" marker-end="url(#exp-sup-arrow)"/>

  <!-- Step 2: Hadamard Operation -->
  <g transform="translate(165, 146)">
    <rect x="0" y="0" width="70" height="52" rx="10" fill="#31135E" stroke="#A56EFF" stroke-width="2.5"/>
    <text x="35" y="32" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="35" y="46" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#BE95FF" text-anchor="middle">HADAMARD</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 200 206 L 200 230" stroke="#BE95FF" stroke-width="2.5" marker-end="url(#exp-sup-arrow)"/>

  <!-- Step 3: Measurement Detector -->
  <g transform="translate(155, 238)">
    <rect x="0" y="0" width="90" height="44" rx="8" fill="#31135E" stroke="#BE95FF" stroke-width="2"/>
    <!-- Arc gauge icon for measurement -->
    <path d="M 28 32 A 16 16 0 0 1 62 32" stroke="#D4BBFF" stroke-width="1.8" fill="none"/>
    <line x1="45" y1="32" x2="56" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="45" y="16" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="0.5">MEASURE</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 200 290 L 200 314" stroke="#BE95FF" stroke-width="2.5" marker-end="url(#exp-sup-arrow)"/>

  <!-- Step 4: Probabilistic Outcome -->
  <g transform="translate(110, 322)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
    <text x="90" y="24" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">|0⟩ (50%) / |1⟩ (50%)</text>
    <text x="90" y="40" font-family="'Inter', sans-serif" font-size="9.5" fill="#D4BBFF" text-anchor="middle">Collapsed Eigenstate</text>
  </g>
</svg>