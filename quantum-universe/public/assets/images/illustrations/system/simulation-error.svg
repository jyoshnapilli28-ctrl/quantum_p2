<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="error-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#491D8B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1C0F30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#1C0F30"/>
  <circle cx="400" cy="300" r="250" fill="url(#error-glow)"/>
  
  <g transform="translate(400, 300)">
    <!-- Broken/Collapsed Wave Function -->
    <path d="M-150,0 Q-100,-50 -50,0 T50,0 T150,0" fill="none" stroke="#491D8B" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M-150,0 L-50,-80 L50,80 L150,0" fill="none" stroke="#BE95FF" stroke-width="3"/>
    
    <!-- Central Error Node -->
    <circle cx="0" cy="0" r="40" fill="#31135E" stroke="#8A3FFC" stroke-width="3"/>
    <path d="M-14,-14 L14,14 M-14,14 L14,-14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Floating State Indicator Particles -->
    <circle cx="-120" cy="-60" r="4" fill="#6929C4"/>
    <circle cx="100" cy="-90" r="6" fill="#8A3FFC"/>
    <circle cx="80" cy="100" r="3" fill="#BE95FF"/>
    <circle cx="-90" cy="80" r="5" fill="#A56EFF"/>
  </g>
</svg>
