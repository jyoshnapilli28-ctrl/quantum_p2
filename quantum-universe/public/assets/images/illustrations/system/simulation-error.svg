<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="error-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#446983" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#071018"/>
  <circle cx="400" cy="300" r="250" fill="url(#error-glow)"/>
  
  <g transform="translate(400, 300)">
    <!-- Broken/Collapsed Wave Function -->
    <path d="M-150,0 Q-100,-50 -50,0 T50,0 T150,0" fill="none" stroke="#38506A" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M-150,0 L-50,-80 L50,80 L150,0" fill="none" stroke="#7991A8" stroke-width="3"/>
    
    <!-- Central Error Node -->
    <circle cx="0" cy="0" r="40" fill="#0B132B" stroke="#446983" stroke-width="4"/>
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Floating Error Particles -->
    <circle cx="-120" cy="-60" r="4" fill="#3A506B"/>
    <circle cx="100" cy="-90" r="6" fill="#38506A"/>
    <circle cx="80" cy="100" r="3" fill="#7991A8"/>
    <circle cx="-90" cy="80" r="5" fill="#446983"/>
  </g>
</svg>
