<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350"  fill="none">

    <defs>
        <!-- Glassmorphism filter -->
        <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Subtle Glow -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <!-- Strong Glow -->
        <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Linear Gradients -->
        <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#071018" />
            <stop offset="100%" stop-color="#0B132B" />
        </linearGradient>
        
        <linearGradient id="surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1C2B38" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0.9"/>
        </linearGradient>

        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#446983" />
            <stop offset="100%" stop-color="#7991A8" />
        </linearGradient>

        <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38506A" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
        </radialGradient>
        
        <!-- Grid Pattern -->
        <pattern id="quantum-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2B38" stroke-width="1"/>
            <circle cx="40" cy="40" r="1" fill="#38506A" />
        </pattern>
        
        <!-- Small Grid Pattern -->
        <pattern id="small-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0B132B" stroke-width="0.5"/>
        </pattern>
    </defs>



    <text x="150" y="50" font-family="'Inter', sans-serif" font-size="14" fill="#7991A8" text-anchor="middle">QUBIT A</text>
    <circle cx="150" cy="100" r="30" fill="url(#surface-grad)" stroke="#38506A"/>
    <text x="150" y="106" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">|0⟩</text>
    
    <text x="350" y="50" font-family="'Inter', sans-serif" font-size="14" fill="#7991A8" text-anchor="middle">QUBIT B</text>
    <circle cx="350" cy="100" r="30" fill="url(#surface-grad)" stroke="#38506A"/>
    <text x="350" y="106" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">|0⟩</text>

    <path d="M 170 120 L 220 180" stroke="#446983" stroke-width="2" opacity="0.6"/>
    <path d="M 330 120 L 280 180" stroke="#446983" stroke-width="2" opacity="0.6"/>
    
    <rect x="180" y="180" width="140" height="40" rx="20" fill="#1C2B38" stroke="#7991A8" stroke-width="2" filter="url(#glow)"/>
    <text x="250" y="205" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ENTANGLED</text>
    
    <path d="M 250 230 L 250 270" stroke="#38506A" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="200" y="280" width="100" height="30" rx="4" fill="#0B132B" stroke="#38506A"/>
    <text x="250" y="300" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Measurement</text>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#446983"/>
        </marker>
    </defs>
    
</svg>