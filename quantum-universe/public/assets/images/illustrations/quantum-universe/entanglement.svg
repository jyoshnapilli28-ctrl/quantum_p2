<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300"  fill="none">

    <defs>
        <!-- Glassmorphism filter -->
        <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Subtle Glow -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <!-- Strong Glow -->
        <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Linear Gradients -->
        <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#071018" />
            <stop offset="100%" stop-color="#0B132B" />
        </linearGradient>
        
        <linearGradient id="surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1C2B38" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0.9"/>
        </linearGradient>

        <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#446983" />
            <stop offset="100%" stop-color="#7991A8" />
        </linearGradient>

        <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38506A" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#071018" stop-opacity="0"/>
        </radialGradient>
        
        <!-- Grid Pattern -->
        <pattern id="quantum-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2B38" stroke-width="1"/>
            <circle cx="40" cy="40" r="1" fill="#38506A" />
        </pattern>
        
        <!-- Small Grid Pattern -->
        <pattern id="small-grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0B132B" stroke-width="0.5"/>
        </pattern>
    </defs>



    <circle cx="150" cy="150" r="40" fill="url(#surface-grad)" stroke="#446983" filter="url(#glow)"/>
    <text x="150" y="156" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">QUBIT A</text>
    
    <circle cx="450" cy="150" r="40" fill="url(#surface-grad)" stroke="#446983" filter="url(#glow)"/>
    <text x="450" y="156" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">QUBIT B</text>

    <!-- Entanglement connection -->
    <path d="M 200 150 Q 300 100 400 150" fill="none" stroke="#7991A8" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M 200 150 Q 300 200 400 150" fill="none" stroke="#7991A8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="300" y="155" font-family="'Inter', sans-serif" font-size="14" fill="#7991A8" text-anchor="middle">ENTANGLED</text>
    
</svg>