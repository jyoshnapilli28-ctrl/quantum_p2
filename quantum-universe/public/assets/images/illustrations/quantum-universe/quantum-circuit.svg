<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" fill="none">
  <!-- Canvas Card -->
  <rect width="600" height="320" rx="16" fill="#1C0F30"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="#491D8B" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="300" y="38" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="2">QUANTUM CIRCUIT MODEL</text>

  <!-- Wires & Components Container -->
  <g transform="translate(40, 50)">
    <!-- Wire 0 (q0) -->
    <text x="15" y="65" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">q₀</text>
    <text x="45" y="65" font-family="'JetBrains Mono', monospace" font-size="13" fill="#BE95FF">|0⟩</text>
    <line x1="75" y1="60" x2="420" y2="60" stroke="#491D8B" stroke-width="2.5"/>

    <!-- Wire 1 (q1) -->
    <text x="15" y="155" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">q₁</text>
    <text x="45" y="155" font-family="'JetBrains Mono', monospace" font-size="13" fill="#BE95FF">|0⟩</text>
    <line x1="75" y1="150" x2="420" y2="150" stroke="#491D8B" stroke-width="2.5"/>

    <!-- Gate H on q0 -->
    <g transform="translate(130, 35)">
      <rect width="50" height="50" rx="8" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
      <text x="25" y="33" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text>
    </g>

    <!-- CNOT Gate: Control on q0, Target on q1 -->
    <!-- Control Dot on q0 -->
    <circle cx="260" cy="60" r="7" fill="#8A3FFC"/>
    <!-- Vertical Connector Line -->
    <line x1="260" y1="60" x2="260" y2="150" stroke="#8A3FFC" stroke-width="2.5"/>
    <!-- Target XOR on q1 -->
    <circle cx="260" cy="150" r="16" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <line x1="244" y1="150" x2="276" y2="150" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="260" y1="134" x2="260" y2="166" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Measurement Gates (M) -->
    <!-- M on q0 -->
    <g transform="translate(350, 38)">
      <rect width="44" height="44" rx="6" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
      <path d="M 12 32 A 16 16 0 0 1 32 32" fill="none" stroke="#BE95FF" stroke-width="1.5"/>
      <line x1="22" y1="32" x2="30" y2="18" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="40" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
    </g>
    <!-- M on q1 -->
    <g transform="translate(350, 128)">
      <rect width="44" height="44" rx="6" fill="#31135E" stroke="#6929C4" stroke-width="2"/>
      <path d="M 12 32 A 16 16 0 0 1 32 32" fill="none" stroke="#BE95FF" stroke-width="1.5"/>
      <line x1="22" y1="32" x2="30" y2="18" stroke="#8A3FFC" stroke-width="2" stroke-linecap="round"/>
      <text x="22" y="40" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
    </g>

    <!-- Classical Output Wires (Double Lines) -->
    <line x1="394" y1="58" x2="490" y2="58" stroke="#6929C4" stroke-width="1.5"/>
    <line x1="394" y1="62" x2="490" y2="62" stroke="#6929C4" stroke-width="1.5"/>
    <text x="500" y="64" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">c₀</text>

    <line x1="394" y1="148" x2="490" y2="148" stroke="#6929C4" stroke-width="1.5"/>
    <line x1="394" y1="152" x2="490" y2="152" stroke="#6929C4" stroke-width="1.5"/>
    <text x="500" y="154" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">c₁</text>
  </g>

  <!-- Step Timeline Indicators -->
  <g transform="translate(40, 245)">
    <rect width="520" height="50" rx="8" fill="#31135E" stroke="#491D8B" stroke-width="1.5"/>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#BE95FF">Step 1: Init</text>
    <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D4BBFF">|00⟩</text>
    
    <text x="175" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#BE95FF">Step 2: Superposition</text>
    <text x="175" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D4BBFF">(|00⟩+|10⟩)/√2</text>
    
    <text x="310" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#BE95FF">Step 3: Entangle (CNOT)</text>
    <text x="310" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D4BBFF">(|00⟩+|11⟩)/√2</text>
    
    <text x="445" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#BE95FF">Step 4: Measurement</text>
    <text x="445" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D4BBFF">{00: 50%, 11: 50%}</text>
  </g>
</svg>