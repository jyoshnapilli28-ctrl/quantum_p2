<svg xmlns="http://www.w3.org/2000/svg" width="450" height="300" viewBox="0 0 450 300" fill="none">
  <!-- Card Background -->
  <rect x="6" y="6" width="438" height="288" rx="14" fill="#1C0F30" stroke="#491D8B" stroke-width="2"/>
  
  <!-- Gate Panel Header -->
  <text x="24" y="32" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#BE95FF" letter-spacing="1">GATE PALETTE</text>
  
  <!-- Gate Palette Tiles (H, X, Y, Z, S, T, CNOT) -->
  <g transform="translate(24, 42)">
    <!-- H -->
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#31135E" stroke="#8A3FFC" stroke-width="1.8"/>
    <text x="17" y="23" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
    
    <!-- X -->
    <rect x="42" y="0" width="34" height="34" rx="6" fill="#31135E" stroke="#8A3FFC" stroke-width="1.8"/>
    <text x="59" y="23" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">X</text>
    
    <!-- Y -->
    <rect x="84" y="0" width="34" height="34" rx="6" fill="#31135E" stroke="#8A3FFC" stroke-width="1.8"/>
    <text x="101" y="23" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Y</text>
    
    <!-- Z -->
    <rect x="126" y="0" width="34" height="34" rx="6" fill="#31135E" stroke="#8A3FFC" stroke-width="1.8"/>
    <text x="143" y="23" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Z</text>
    
    <!-- S -->
    <rect x="168" y="0" width="34" height="34" rx="6" fill="#31135E" stroke="#8A3FFC" stroke-width="1.8"/>
    <text x="185" y="23" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">S</text>
    
    <!-- T -->
    <rect x="210" y="0" width="34" height="34" rx="6" fill="#31135E" stroke="#8A3FFC" stroke-width="1.8"/>
    <text x="227" y="23" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">T</text>
    
    <!-- CNOT -->
    <rect x="252" y="0" width="46" height="34" rx="6" fill="#31135E" stroke="#BE95FF" stroke-width="1.8"/>
    <circle cx="266" cy="17" r="3.5" fill="#BE95FF"/>
    <line x1="266" y1="17" x2="284" y2="17" stroke="#BE95FF" stroke-width="1.5"/>
    <circle cx="284" cy="17" r="6" fill="#31135E" stroke="#BE95FF" stroke-width="1.5"/>
    <text x="284" y="20.5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>

    <!-- SWAP -->
    <rect x="306" y="0" width="46" height="34" rx="6" fill="#31135E" stroke="#BE95FF" stroke-width="1.8"/>
    <text x="329" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SWAP</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="92" x2="426" y2="92" stroke="#491D8B" stroke-width="1"/>

  <!-- Circuit Section Header -->
  <text x="24" y="116" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#BE95FF" letter-spacing="1">CIRCUIT CANVAS</text>

  <!-- Qubit 0 Wire -->
  <text x="26" y="157" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">q₀</text>
  <line x1="60" y1="152" x2="415" y2="152" stroke="#6929C4" stroke-width="2.5"/>

  <!-- Qubit 1 Wire -->
  <text x="26" y="235" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">q₁</text>
  <line x1="60" y1="230" x2="415" y2="230" stroke="#6929C4" stroke-width="2.5"/>

  <!-- Gate H on q0 -->
  <g transform="translate(130, 130)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#31135E" stroke="#8A3FFC" stroke-width="2"/>
    <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
  </g>

  <!-- CNOT: Control on q0, Target on q1 -->
  <!-- Vertical Link -->
  <line x1="250" y1="152" x2="250" y2="230" stroke="#BE95FF" stroke-width="2.5"/>
  <!-- Control Dot -->
  <circle cx="250" cy="152" r="7" fill="#8A3FFC"/>
  <!-- Target XOR Circle -->
  <circle cx="250" cy="230" r="16" fill="#31135E" stroke="#8A3FFC" stroke-width="2.5"/>
  <line x1="237" y1="230" x2="263" y2="230" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="217" x2="250" y2="243" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Measurement on q0 -->
  <g transform="translate(345, 132)">
    <rect x="0" y="0" width="42" height="40" rx="6" fill="#31135E" stroke="#A56EFF" stroke-width="2"/>
    <path d="M 9 29 A 12 12 0 0 1 33 29" stroke="#D4BBFF" stroke-width="1.8" fill="none"/>
    <line x1="21" y1="29" x2="29" y2="18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Measurement on q1 -->
  <g transform="translate(345, 210)">
    <rect x="0" y="0" width="42" height="40" rx="6" fill="#31135E" stroke="#A56EFF" stroke-width="2"/>
    <path d="M 9 29 A 12 12 0 0 1 33 29" stroke="#D4BBFF" stroke-width="1.8" fill="none"/>
    <line x1="21" y1="29" x2="29" y2="18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>