<svg xmlns="http://www.w3.org/2000/svg" width="250" height="180" viewBox="0 0 250 180" fill="none">
  <!-- Card Background -->
  <rect x="5" y="5" width="240" height="170" rx="12" fill="#1C0F30" stroke="#491D8B" stroke-width="2"/>
  
  <!-- Title -->
  <text x="125" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#BE95FF" text-anchor="middle" letter-spacing="1">CNOT (CONTROLLED-X)</text>

  <!-- Wire q0 (Control) -->
  <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF">q₀</text>
  <line x1="50" y1="62" x2="220" y2="62" stroke="#6929C4" stroke-width="2.5"/>

  <!-- Wire q1 (Target) -->
  <text x="24" y="134" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF">q₁</text>
  <line x1="50" y1="130" x2="220" y2="130" stroke="#6929C4" stroke-width="2.5"/>

  <!-- Vertical Control Link -->
  <line x1="135" y1="62" x2="135" y2="130" stroke="#BE95FF" stroke-width="2.5"/>

  <!-- Control Dot -->
  <circle cx="135" cy="62" r="7" fill="#8A3FFC"/>

  <!-- Target XOR Circle -->
  <circle cx="135" cy="130" r="16" fill="#31135E" stroke="#8A3FFC" stroke-width="2.5"/>
  <line x1="122" y1="130" x2="148" y2="130" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="135" y1="117" x2="135" y2="143" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>