<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none">
  <!-- Concentric Quantum Orbit Lines -->
  <circle cx="150" cy="150" r="130" stroke="#491D8B" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="150" cy="150" r="95" stroke="#6929C4" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="150" r="60" stroke="#8A3FFC" stroke-width="2" opacity="0.6"/>

  <!-- Orbital Ellipses -->
  <ellipse cx="150" cy="150" rx="120" ry="45" stroke="#491D8B" stroke-width="1.5" transform="rotate(35 150 150)" opacity="0.5"/>
  <ellipse cx="150" cy="150" rx="120" ry="45" stroke="#491D8B" stroke-width="1.5" transform="rotate(-35 150 150)" opacity="0.5"/>

  <!-- Orbital Node Markers -->
  <circle cx="150" cy="150" r="6" fill="#FFFFFF"/>
  <circle cx="210" cy="150" r="3.5" fill="#8A3FFC"/>
  <circle cx="90" cy="150" r="3" fill="#BE95FF"/>
  <circle cx="150" cy="245" r="3" fill="#A56EFF"/>
  <circle cx="240" cy="100" r="2.5" fill="#D4BBFF"/>
</svg>
